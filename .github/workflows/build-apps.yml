name: Compilar apps (Android, iOS y Linux)

on:
  push:
    branches: [main]
    # Documentation-only changes do not produce new app builds
    paths-ignore:
      - "**.md"
      - "legal/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: write

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Generar iconos y pantalla de inicio
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#0e1624' --splashBackgroundColor '#0e1624'
      - name: Sincronizar web
        run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Tinitus.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Tinitus.apk

  ios:
    name: iOS IPA (sin firmar)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Crear proyecto iOS
        run: npx cap add ios
      - name: Generar iconos y pantalla de inicio
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --ios --iconBackgroundColor '#0e1624' --splashBackgroundColor '#0e1624'
      - name: Sincronizar web
        run: npx cap sync ios
      - name: Audio en segundo plano y nombre
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Tinitus" "$PLIST" || true
      - name: Compilar app (iPhone + iPad)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            TARGETED_DEVICE_FAMILY="1,2" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Tinitus-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Tinitus-unsigned.ipa

  linux:
    name: Linux (.deb Ubuntu + .rpm Fedora)
    # Pinned: ubuntu-latest (26.04) ships rpm 6, which electron-builder's fpm
    # cannot drive; 24.04 has rpm 4.18 and matches the Ubuntu target.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar rpmbuild
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Compilar .deb y .rpm
        # Version 1.0.<build> so that apt/dnf treat each release as an upgrade
        run: npx electron-builder --linux deb rpm --x64 --publish never -c.extraMetadata.version=1.0.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/Tinitus-amd64.deb
            dist/Tinitus-x86_64.rpm

  release:
    name: Publicar descargas
    needs: [android, ios, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Crear release con APK e IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Tinitus.apk Tinitus-unsigned.ipa Tinitus-amd64.deb Tinitus-x86_64.rpm \
            --repo "${{ github.repository }}" \
            --title "Tinitus · build ${{ github.run_number }}" \
            --notes "Android APK (direct install), unsigned iPhone/iPad IPA (install with Sideloadly or AltStore), Linux .deb (Ubuntu 24.04) and .rpm (Fedora). See README."
